<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glowing Neon Circular Authentication</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">

</head>
<body>
  <div class="ambient-glow cyan"></div>
  <div class="ambient-glow magenta"></div>

  <main class="auth-wrapper" role="region" aria-label="User Authentication">
    <div class="card-surface">
      
      <!-- ================= LOGIN FORM ================= -->
      <section class="form-panel active" id="loginPanel" aria-labelledby="loginTitle">
        <h1 id="loginTitle" class="neon-title">WELCOME</h1>
        <p class="sub-title">Login to your account</p>

        <form id="loginForm" onsubmit="handleAuthSubmit(event, 'login')">
          <div class="input-group">
            <input 
              type="email" 
              class="input-field" 
              placeholder="Email Address" 
              required
              autocomplete="email"
            >
          </div>

          <div class="input-group">
            <input 
              type="password" 
              id="loginPassword" 
              class="input-field has-icon" 
              placeholder="Password" 
              required
              autocomplete="current-password"
            >
            <button 
              type="button" 
              class="toggle-password" 
              onclick="togglePassword('loginPassword', this)" 
              aria-label="Toggle password visibility"
              title="Show password"
            >
              <!-- Eye Icon (Closed / Open state) -->
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <div class="options-row">
            <label class="remember-box">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="javascript:void(0)" class="forgot-link" onclick="triggerToast('Password reset link sent to your email!')">Forgot?</a>
          </div>

          <button type="submit" class="submit-btn" id="loginBtn">LOGIN</button>
        </form>

        <p class="switch-mode-text">
          Don't have an account? 
          <a role="button" tabindex="0" onclick="switchAuthView('signup')">Sign Up</a>
        </p>
      </section>

      <!-- ================= SIGN UP FORM ================= -->
      <section class="form-panel" id="signupPanel" aria-labelledby="signupTitle">
        <h1 id="signupTitle" class="neon-title">SIGN UP</h1>
        <p class="sub-title">Create your account</p>

        <form id="signupForm" onsubmit="handleAuthSubmit(event, 'signup')">
          <div class="input-group">
            <input 
              type="text" 
              class="input-field" 
              placeholder="Full Name" 
              required
              autocomplete="name"
            >
          </div>

          <div class="input-group">
            <input 
              type="email" 
              class="input-field" 
              placeholder="Email Address" 
              required
              autocomplete="email"
            >
          </div>

          <div class="input-group">
            <input 
              type="password" 
              id="signupPassword" 
              class="input-field has-icon" 
              placeholder="Password" 
              required
              autocomplete="new-password"
            >
            <button 
              type="button" 
              class="toggle-password" 
              onclick="togglePassword('signupPassword', this)" 
              aria-label="Toggle password visibility"
              title="Show password"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <button type="submit" class="submit-btn" id="signupBtn">CREATE ACCOUNT</button>
        </form>

        <p class="switch-mode-text">
          Already have an account? 
          <a role="button" tabindex="0" onclick="switchAuthView('login')">Login</a>
        </p>
      </section>

    </div>
  </main>

  <div id="toastNotification" class="toast-msg" role="status" aria-live="polite">Done!</div>



  <!---------------------------------- Footer Section ---------------------------------------------->
  <footer class="site-footer">
      <div class="footer-container">
          <!-- ব্র্যান্ড / কপিরাইট অংশ -->
          <div class="footer-brand">
              <span class="neon-dot"></span>
              <p>&copy; 2026 <strong>Coding SOMU</strong>. All rights reserved.</p>
          </div>
  
          <!-- নেভিগেশন লিংকস -->
          <ul class="footer-links">
              <li><a href="#privacy">Privacy Policy</a></li>
              <li><a href="#terms">Terms of Service</a></li>
              <li><a href="#support">Support</a></li>
              <li><a href="#contact">Contact</a></li>
          </ul>
  
          <!-- সোশ্যাল মিডিয়া আইকন -->
          <div class="footer-socials">
              <a href="#" aria-label="Github">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                  </svg>
              </a>
              <a href="#" aria-label="Twitter">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
                  </svg>
              </a>
              <a href="#" aria-label="LinkedIn">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                      <rect x="2" y="9" width="4" height="12"></rect>
                      <circle cx="4" cy="4" r="2"></circle>
                  </svg>
              </a>
          </div>
      </div>
  </footer>
  <!----------------------------------------- footer end ----------------------------------->
</body>

<script src="JS/login.js"></script>
</html>
